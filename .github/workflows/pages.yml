name: Publish personal site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - script.js
      - motion.js
      - site-config.js
      - favicon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript and interactions
        run: |
          node --check script.js
          node --check motion.js
          node --check site-config.js
          node --check contact.js
          node tests/social.test.cjs
          node tests/contact.test.cjs
          node tests/motion.test.cjs
          node tests/animation.test.cjs
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js motion.js contact.js site-config.js favicon.png _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
